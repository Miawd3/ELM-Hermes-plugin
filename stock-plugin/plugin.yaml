name: elm
version: 0.4.0-preview
description: "Local scoped memory for Hermes: reviewed notes, automatic recall (also as memory.provider: elm), skills and opt-in query planning. No host patches."
author: ELM plugin contributors
license: Apache-2.0
kind: standalone
requires_hermes: ">=0.23.1"
python_dependencies: []
requires_env: []
provides_tools:
  - elm_memory
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - post_compaction
  - on_session_delete
  - subagent_start
  - subagent_stop
capabilities: []
tags:
  - memory
  - local
