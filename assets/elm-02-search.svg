 y="215" width="222" height="88" fill="#faf8f1" stroke="#c9ccbe" stroke-width="1"/><text x="881" y="241" fill="#697267" font-family="monospace" font-size="11" font-weight="600" >RELEVANT RESULT</text><text x="881" y="266" fill="#24352c" font-family="Arial, sans-serif" font-size="19" font-weight="600" >Saved evidence</text><text x="881" y="287" fill="#697267" font-family="Arial, sans-serif" font-size="14" font-weight="400" >+ source location</text><text x="575" y="354" fill="#697267" font-family="Arial, sans-serif" font-size="17" font-weight="400" >Local index → selected evidence → exact source</text><text x="59" y="383" fill="#697267" font-family="Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="2">SEARCH WHEN NEEDED</text></svg>